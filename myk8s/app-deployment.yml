apiVersion: apps/v1
kind: Deployment
metadata:
  name: myflask-app
  namespace: flask-sql-namespace
  labels:
    app: myflask-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myflask-app
  template:
    metadata:
      labels:
        app: myflask-app
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          echo "Waiting for MySQL to be ready..."
          until nc -z mysql 3306; do
            echo "MySQL is not ready yet — sleeping 3s"
            sleep 3
          done
          echo "MySQL is ready!"
      containers:
      - name: myflask-app
        image: salehktk005/myflask-app:latest
        imagePullPolicy: Always
        env:
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_HOST
          value: "mysql"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-user
        - name: MYSQL_DB
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-database
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
