apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saleh-thoughts-app
  namespace: flask-sql-namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saleh-thoughts-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
